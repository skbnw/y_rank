name: rank check

on:
  schedule:
    - cron: '0 * * * *'  # 毎時00分に実行
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v3
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          # PyPI への一時的な接続タイムアウト対策として、pip 自体のリトライに加え最大3回まで再試行する
          for i in 1 2 3; do
            pip install --retries 10 --timeout 60 pandas requests beautifulsoup4 pytz boto3 && break
            if [ "$i" -eq 3 ]; then
              echo "pip install failed after $i attempts"
              exit 1
            fi
            echo "pip install failed (attempt $i), retrying in $((i * 15)) seconds..."
            sleep $((i * 15))
          done
      
      - name: Run scraper
        run: python py/rank.py  # スクリプトのパスを更新

      - name: Set Git Config
        run: |
          git config user.name "Automated"
          git config user.email "actions@users.noreply.github.com"
        working-directory: ${{ github.workspace }}

      - name: Pull remote changes
        run: git pull origin main
        working-directory: ${{ github.workspace }}

      - name: Commit and push csv files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Update csv files - $(date +'%Y-%m-%d')"
            git push
          else
            echo "No changes to commit"
          fi
        working-directory: ${{ github.workspace }}
